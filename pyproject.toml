[project]
name = "live-line-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anzu324"}
]
requires-python = ">=3.14"
dependencies = [
    "pyqtdarktheme>=2.1.0",
    "pyside6>=6.11.1",
]

[project.scripts]
live-line-builder = "live_line_builder:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
